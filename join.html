<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meeting Preview UI</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Inter, Arial, sans-serif;
}

body {
  min-height: 100vh;
  background:
    linear-gradient(rgba(245,247,255,.86), rgba(245,247,255,.9)),
    radial-gradient(circle at top, #dfe8ff, transparent 45%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #2d3748;
}

.wrapper {
  width: 100%;
  max-width: 760px;
  padding: 30px;
  text-align: center;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin-bottom: 34px;
}

.logo {
  width: 64px;
  height: 64px;
  border-radius: 18px;
  background: #ffffff;
  box-shadow: 0 12px 35px rgba(0,0,0,.08);
  display: grid;
  place-items: center;
  font-weight: 700;
  color: #2d8cff;
}

.brand h1 {
  font-size: 25px;
  color: #5b6b8a;
}

.brand p {
  color: #9aa6bd;
  font-size: 14px;
  margin-top: 4px;
}

.card {
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(18px);
  border-radius: 28px;
  padding: 34px;
  max-width: 520px;
  margin: auto;
  box-shadow:
    0 30px 80px rgba(31, 72, 130, .16),
    inset 0 0 0 1px rgba(255,255,255,.7);
}

.card h2 {
  text-align: left;
  font-size: 22px;
  margin-bottom: 28px;
  color: #4a5568;
}

.host {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

.avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: linear-gradient(135deg, #5874d8, #6b8cff);
  color: white;
  font-weight: 700;
  display: grid;
  place-items: center;
  font-size: 18px;
}

.host-info {
  text-align: left;
}

.host-info strong {
  display: block;
  font-size: 16px;
  color: #4a5568;
}

.host-info span {
  font-size: 13px;
  color: #9aa6bd;
}

.meta {
  display: flex;
  gap: 22px;
  color: #9aa6bd;
  font-size: 14px;
  margin-bottom: 18px;
}

.notice {
  background: linear-gradient(135deg, #eef6ff, #f7fbff);
  color:  #0D6BDE;
  padding: 18px;
  border-radius: 14px;
  font-weight: 600;
  margin-bottom: 18px;
}

button {
  width: 100%;
  border: none;
  padding: 18px;
  border-radius: 14px;
  background: linear-gradient(135deg, #0D6BDE, #0D6BDE);
  color: white;
  font-size: 17px;
  font-weight: 700;
  cursor: default;
  box-shadow: 0 12px 26px rgba(45,140,255,.35);
}

.note {
  margin-top: 18px;
  font-size: 12px;
  color: #a0aec0;
}

.meeting-id {
  margin-top: 28px;
  color: #b4bfd3;
  font-size: 13px;
}

a{
  text-decoration: none;
}

@media (max-width: 560px) {
  .card {
    padding: 24px;
  }

  .meta {
    flex-direction: column;
    gap: 8px;
    text-align: left;
  }
}
</style>
</head>
