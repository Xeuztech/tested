<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meeting Loading Screen</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Inter, Arial, sans-serif;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(circle at center, #ffffff 0%, #f3f6fb 45%, #eef2f8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #667085;
}

.screen {
  width: 100%;
  max-width: 720px;
  text-align: center;
  padding: 40px 20px;
}

.app-icon {
  width: 92px;
  height: 92px;
  margin: 0 auto 26px;
  border-radius: 22px;
  border: 2px solid #d7e2f4;
  background: rgba(255, 255, 255, 0.75);
  box-shadow:
    0 25px 70px rgba(85, 120, 180, 0.12),
    inset 0 0 0 1px rgba(255,255,255,.8);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #4a90e2;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .3px;
}

h1 {
  font-size: 32px;
  font-weight: 700;
  color: #0D6BDE;
  margin-bottom: 16px;
}

.subtitle {
  font-size: 15px;
  color: #a7b0c3;
  margin-bottom: 34px;
}

.loader {
  display: flex;
  justify-content: center;
  gap: 14px;
  margin-bottom: 42px;
}

.loader span {
  width: 8px;
  height: 8px;
  background: #0D6BDE;
  border-radius: 50%;
  animation: pulse 1.3s infinite ease-in-out;
}

.loader span:nth-child(2) {
  animation-delay: .18s;
}

.loader span:nth-child(3) {
  animation-delay: .36s;
}

@keyframes pulse {
  0%, 80%, 100% {
    opacity: .25;
    transform: scale(.8);
  }
  40% {
    opacity: 1;
    transform: scale(1.25);
  }
}

.meeting-id {
  font-size: 13px;
  color: #9aa8bd;
}

.blur-card {
  position: absolute;
  width: 520px;
  height: 260px;
  background: rgba(120, 160, 220, .08);
  filter: blur(60px);
  border-radius: 50%;
  z-index: -1;
}

@media (max-width: 520px) {
  h1 {
    font-size: 26px;
  }

  .app-icon {
    width: 78px;
    height: 78px;
  }
}
</style>
</head>
